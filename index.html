<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>oilim</title>
<meta name="theme-color" content="#12a150">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Unbounded:wght@500;700&display=swap" rel="stylesheet">
<style>
/* Раскладка: список чатов слева, переписка справа; на телефоне одна панель за раз. */
:root{
  --bg:#eef5f0; --surface:#ffffff; --surface2:#f4f9f5; --ink:#0f1f16; --muted:#5d7266; --line:#d9e6dd;
  --accent:#12a150; --accent2:#0b7d3d; --on-accent:#ffffff; --bubble-them:#ffffff; --bubble-me:#12a150;
  --danger:#d33a3a; --shadow:0 6px 24px rgba(10,60,30,.10);
  --f-display:'Unbounded','Manrope',system-ui,sans-serif; --f-body:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0a130e; --surface:#111d16; --surface2:#16251c; --ink:#e5f2ea; --muted:#88a495; --line:#1f3427;
  --accent:#2fd37a; --accent2:#1fae62; --on-accent:#04210f; --bubble-them:#18291f; --bubble-me:#1c8f53;
  --danger:#ff6b6b; --shadow:0 6px 24px rgba(0,0,0,.4); color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0a130e; --surface:#111d16; --surface2:#16251c; --ink:#e5f2ea; --muted:#88a495; --line:#1f3427;
  --accent:#2fd37a; --accent2:#1fae62; --on-accent:#04210f; --bubble-them:#18291f; --bubble-me:#1c8f53;
  --danger:#ff6b6b; --shadow:0 6px 24px rgba(0,0,0,.4); color-scheme:dark;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--f-body);overflow:hidden}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
.logo{font-family:var(--f-display);font-weight:700;letter-spacing:-.02em}

/* ---------- auth ---------- */
#auth{position:fixed;inset:0;display:grid;place-items:center;padding:20px;overflow:auto;
  background:radial-gradient(900px 500px at 15% -10%,color-mix(in srgb,var(--accent) 28%,transparent),transparent 60%),
             radial-gradient(700px 500px at 100% 110%,color-mix(in srgb,var(--accent) 20%,transparent),transparent 60%),var(--bg)}
.card{width:min(420px,100%);background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:28px 24px;box-shadow:var(--shadow)}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.brand img{width:48px;height:48px;border-radius:14px}
.brand .logo{font-size:26px}
.brand small{display:block;color:var(--muted);font-family:var(--f-body);font-weight:500;font-size:13px;letter-spacing:0}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--surface2);border-radius:12px;padding:4px;margin-bottom:18px}
.seg button{padding:9px;border-radius:9px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.12)}
label.f{display:block;font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin:14px 0 6px}
.in{width:100%;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface2);outline:none}
.in:focus{border-color:var(--accent)}
.hint{font-size:12.5px;color:var(--muted);margin-top:6px;min-height:1.2em}
.hint.bad{color:var(--danger)} .hint.ok{color:var(--accent2)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 18px;border-radius:12px;font-weight:700;background:var(--accent);color:var(--on-accent)}
.btn:hover{background:var(--accent2);color:#fff}
.btn.block{width:100%;margin-top:20px}
.btn.ghost{background:var(--surface2);color:var(--ink);border:1px solid var(--line)}
.btn.ghost:hover{background:var(--line);color:var(--ink)}
.btn.sm{padding:7px 12px;border-radius:10px;font-size:13px}
.btn.danger{background:transparent;color:var(--danger);border:1px solid var(--danger)}
.btn:disabled{opacity:.55;cursor:default}
.avpick{display:flex;align-items:center;gap:14px}
.avpick .btns{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.err{color:var(--danger);font-size:13.5px;margin-top:12px;min-height:1.3em}

/* ---------- avatars ---------- */
.av{flex:none;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;overflow:hidden;position:relative;user-select:none}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.av .dot{position:absolute;right:0;bottom:0;width:30%;height:30%;border-radius:50%;background:var(--accent);border:2px solid var(--surface)}

/* ---------- app ---------- */
#app{position:fixed;inset:0;display:grid;grid-template-columns:360px 1fr;background:var(--bg)}
.side{display:flex;flex-direction:column;min-height:0;background:var(--surface);border-right:1px solid var(--line)}
.top{display:flex;align-items:center;gap:10px;padding:calc(12px + env(safe-area-inset-top,0px)) 14px 10px}
.top img.lg{width:34px;height:34px;border-radius:10px}
.top .logo{font-size:20px;flex:1}
.iconbtn{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;color:var(--muted);position:relative}
.iconbtn:hover{background:var(--surface2);color:var(--ink)}
.iconbtn svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tabs{display:flex;gap:4px;padding:0 10px 8px;border-bottom:1px solid var(--line)}
.tabs button{flex:1;padding:9px 6px;border-radius:10px;font-weight:700;font-size:13.5px;color:var(--muted);position:relative}
.tabs button.on{background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--accent2)}
:root[data-theme="dark"] .tabs button.on{color:var(--accent)}
.badge{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--accent);color:var(--on-accent);font-size:11.5px;font-weight:800}
.panel{flex:1;overflow:auto;min-height:0;padding:6px 0 calc(8px + env(safe-area-inset-bottom,0px))}
.row{display:flex;align-items:center;gap:12px;padding:10px 14px;width:100%;text-align:left}
.row:hover,.row.on{background:var(--surface2)}
.row .mid{flex:1;min-width:0}
.row .nm{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .sub{color:var(--muted);font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .meta{display:flex;flex-direction:column;align-items:flex-end;gap:4px;font-size:12px;color:var(--muted)}
.empty{padding:36px 24px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:6px}
.search{padding:10px 14px}
.sect{padding:12px 16px 4px;font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}

/* ---------- chat ---------- */
.main{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--bg);
  background-image:radial-gradient(color-mix(in srgb,var(--accent) 9%,transparent) 1.2px,transparent 1.4px);background-size:22px 22px}
.ph{margin:auto;text-align:center;color:var(--muted);padding:24px}
.ph img{width:96px;height:96px;border-radius:26px;margin-bottom:14px;opacity:.95}
.chead{display:flex;align-items:center;gap:12px;padding:calc(10px + env(safe-area-inset-top,0px)) 14px 10px;background:var(--surface);border-bottom:1px solid var(--line)}
.chead .mid{flex:1;min-width:0}.chead .nm{font-weight:800}.chead .st{font-size:12.5px;color:var(--muted)}
.chead .back{display:none}
.msgs{flex:1;overflow:auto;padding:14px max(12px,env(safe-area-inset-left,0px)) 8px max(12px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:3px}
.day{align-self:center;margin:10px 0 6px;padding:3px 12px;border-radius:12px;background:var(--surface);border:1px solid var(--line);font-size:12px;color:var(--muted);font-weight:600}
.m{max-width:min(78%,520px);padding:8px 12px 6px;border-radius:18px;background:var(--bubble-them);box-shadow:0 1px 2px rgba(0,0,0,.08);align-self:flex-start;border-bottom-left-radius:6px;position:relative;overflow-wrap:anywhere;white-space:pre-wrap}
.m.me{align-self:flex-end;background:var(--bubble-me);color:#fff;border-bottom-left-radius:18px;border-bottom-right-radius:6px}
.m .t{display:flex;justify-content:flex-end;align-items:center;gap:4px;font-size:11px;opacity:.7;margin-top:2px;white-space:nowrap}
.m .x{position:absolute;top:4px;right:-26px;width:22px;height:22px;opacity:0;color:var(--muted);font-size:16px;line-height:1}
.m.me .x{right:auto;left:-26px}
.m:hover .x{opacity:1}
.m img.pic{display:block;max-width:100%;width:300px;max-height:340px;object-fit:cover;border-radius:12px;cursor:zoom-in;background:var(--surface2);min-height:120px}
.m .cap{margin-top:6px}
.file{display:flex;align-items:center;gap:10px;min-width:210px;white-space:normal}
.file .ic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:color-mix(in srgb,var(--accent) 18%,transparent);color:var(--accent2);flex:none}
.m.me .file .ic{background:rgba(255,255,255,.22);color:#fff}
.file .fi{min-width:0;flex:1}.file .fn{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.file .fs{font-size:12px;opacity:.75}
.prog{height:4px;border-radius:2px;background:rgba(127,127,127,.25);margin-top:6px;overflow:hidden}.prog i{display:block;height:100%;background:var(--accent);width:0;transition:width .15s}
.m.me .prog i{background:#fff}
.voice{display:flex;align-items:center;gap:10px;min-width:220px}
.voice .pl{width:38px;height:38px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;flex:none}
.m.me .voice .pl{background:#fff;color:var(--accent2)}
.voice svg{width:16px;height:16px;fill:currentColor}
.voice .bar{flex:1;height:26px;display:flex;align-items:center;gap:2px;cursor:pointer}
.voice .bar span{flex:1;border-radius:2px;background:currentColor;opacity:.32;min-width:2px}
.voice .bar span.on{opacity:1}
.voice .d{font-size:12px;opacity:.8;font-variant-numeric:tabular-nums;min-width:34px;text-align:right}
.composer{display:flex;align-items:flex-end;gap:6px;padding:8px max(10px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px));background:var(--surface);border-top:1px solid var(--line);position:relative}
.composer textarea{flex:1;resize:none;max-height:140px;min-height:42px;padding:10px 14px;border-radius:21px;border:1.5px solid var(--line);background:var(--surface2);outline:none;line-height:1.35}
.composer textarea:focus{border-color:var(--accent)}
.send{width:42px;height:42px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;flex:none}
.send svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.rec{position:absolute;inset:0;background:var(--surface);display:flex;align-items:center;gap:12px;padding:0 14px;z-index:3}
.rec .pulse{width:12px;height:12px;border-radius:50%;background:var(--danger);animation:pu 1s infinite}
@keyframes pu{50%{opacity:.3;transform:scale(.8)}}
.rec .tm{font-variant-numeric:tabular-nums;font-weight:700;flex:1}
.emo{position:absolute;bottom:100%;left:10px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:8px;display:grid;grid-template-columns:repeat(8,1fr);gap:2px;box-shadow:var(--shadow);width:min(340px,calc(100% - 20px));z-index:4}
.emo button{font-size:22px;padding:4px;border-radius:8px}.emo button:hover{background:var(--surface2)}
.pending{opacity:.85}

/* ---------- settings ---------- */
.set{padding:8px 16px 20px}
.set h4{margin:18px 0 8px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.line{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.line:last-child{border:0}
.sw{position:relative;width:46px;height:26px;flex:none}
.sw input{opacity:0;position:absolute;inset:0;margin:0;cursor:pointer;z-index:1}
.sw i{position:absolute;inset:0;border-radius:13px;background:var(--line);transition:.2s}
.sw i::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.sw input:checked+i{background:var(--accent)}.sw input:checked+i::after{transform:translateX(20px)}
.sw input:focus-visible+i{outline:2px solid var(--accent);outline-offset:2px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:6px 12px;border-radius:16px;border:1.5px solid var(--line);font-weight:600;font-size:13px}
.chip.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,transparent)}
.prof{display:flex;gap:14px;align-items:center;margin:10px 0}

/* ---------- misc ---------- */
#lb{position:fixed;inset:0;background:rgba(0,0,0,.88);display:grid;place-items:center;z-index:50;padding:16px}
#lb img{max-width:100%;max-height:100%;border-radius:8px}
#toasts{position:fixed;left:50%;transform:translateX(-50%);top:calc(14px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:8px;z-index:60;width:min(92vw,380px)}
.toast{background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:14px;box-shadow:var(--shadow);font-weight:600;font-size:14px;animation:tin .25s;cursor:pointer}
@keyframes tin{from{transform:translateY(-12px);opacity:0}}
#boot{position:fixed;inset:0;display:grid;place-items:center;background:var(--bg);z-index:70}
#boot img{width:84px;height:84px;border-radius:24px;animation:bp 1.2s ease-in-out infinite}
@keyframes bp{50%{transform:scale(.92);opacity:.7}}
@media (max-width:820px){
  #app{grid-template-columns:1fr}
  #app .main{display:none}
  #app.in-chat .side{display:none}
  #app.in-chat .main{display:flex}
  .chead .back{display:grid}
  .m{max-width:86%}.m .x{display:none}
  .m img.pic{width:240px}
}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;clip:rect(0 0 0 0);pointer-events:none}
.in,.composer textarea{font-size:16px}
.btn,.send,.iconbtn,.chip,.row,.tabs button,.seg button{transition:background .18s,transform .12s,color .18s,box-shadow .18s,border-color .18s}
.btn:active,.send:active,.iconbtn:active,.chip:active{transform:scale(.93)}
.row:active{transform:scale(.985)}
.send:hover{transform:scale(1.06)}
.card{animation:rise .5s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(18px) scale(.98)}}
#app:not([hidden]){animation:fade .35s both}
@keyframes fade{from{opacity:0}}
.panel.swap>*{animation:rise .28s cubic-bezier(.2,.8,.2,1) both}
.m.in{animation:mIn .26s cubic-bezier(.2,.9,.3,1.25) both;transform-origin:0 100%}
.m.me.in{transform-origin:100% 100%}
@keyframes mIn{from{opacity:0;transform:translateY(10px) scale(.86)}}
.day{animation:fade .3s both}
.avpick .av{transition:transform .25s}.avpick .av:hover{transform:rotate(-6deg) scale(1.05)}
.av .dot{animation:dotp 2.4s ease-in-out infinite}
@keyframes dotp{50%{box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 25%,transparent)}}
.emo{animation:pop .18s cubic-bezier(.2,.9,.3,1.3);transform-origin:0 100%}
@keyframes pop{from{opacity:0;transform:scale(.85) translateY(8px)}}
.rec{animation:fade .2s both}
.toast.out{opacity:0;transform:translateY(-10px);transition:.3s}
#lb:not([hidden]){animation:fade .2s}#lb:not([hidden]) img{animation:zoom .25s cubic-bezier(.2,.9,.3,1.1)}
@keyframes zoom{from{transform:scale(.9);opacity:0}}
.send svg{animation:pop .2s}
@media (max-width:820px){#app.in-chat .main{animation:slide .26s cubic-bezier(.2,.8,.2,1)}}
@keyframes slide{from{transform:translateX(40px);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div id="boot"><img src="icon.svg" alt="oilim"></div>

<!-- ============ ВХОД / РЕГИСТРАЦИЯ ============ -->
<section id="auth" hidden>
  <form class="card" id="authForm" autocomplete="on">
    <div class="brand"><img src="icon.svg" alt=""><div class="logo">oilim<small>мессенджер без почты</small></div></div>
    <div class="seg" role="tablist">
      <button type="button" id="tabIn" class="on">Вход</button>
      <button type="button" id="tabUp">Регистрация</button>
    </div>
    <div id="upOnly" hidden>
      <div class="avpick">
        <div id="avPrev"></div>
        <div class="btns">
          <label class="btn ghost sm" for="avFile" id="avBtn" tabindex="0">Выбрать аватарку</label>
          <span class="hint" style="margin:0">Можно пропустить</span>
        </div>
        <input type="file" id="avFile" class="vh" accept="image/*,.heic,.heif">
      </div>
      <label class="f" for="dname">Имя</label>
      <input class="in" id="dname" maxlength="40" placeholder="Как вас показывать" autocomplete="name">
    </div>
    <label class="f" for="nick">Ник</label>
    <input class="in" id="nick" maxlength="20" placeholder="например, green_fox" autocomplete="username" autocapitalize="none" spellcheck="false" required>
    <div class="hint" id="nickHint"></div>
    <label class="f" for="pass">Пароль</label>
    <input class="in" id="pass" type="password" minlength="6" maxlength="72" placeholder="минимум 6 символов" autocomplete="current-password" required>
    <div class="err" id="authErr" role="alert"></div>
    <button class="btn block" id="authGo" type="submit">Войти</button>
  </form>
</section>

<!-- ============ ПРИЛОЖЕНИЕ ============ -->
<div id="app" hidden>
  <aside class="side">
    <div class="top">
      <img class="lg" src="icon.svg" alt=""><div class="logo">oilim</div>
      <button class="iconbtn" id="themeBtn" title="Тема" aria-label="Сменить тему"><svg viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
    </div>
    <nav class="tabs">
      <button id="tChats" class="on">Чаты <span class="badge" id="bUnread" hidden></span></button>
      <button id="tPeople">Люди <span class="badge" id="bReq" hidden></span></button>
      <button id="tSet">Настройки</button>
    </nav>
    <div class="panel" id="panel"></div>
  </aside>
  <main class="main" id="main"></main>
</div>

<input type="file" id="avFileSet" class="vh" accept="image/*,.heic,.heif" tabindex="-1">
<div id="lb" hidden><img alt=""></div>
<div id="toasts" aria-live="polite"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>

function h(tag, attrs, ...kids) {

function toggleEmoji() {
  const ex = $('.emo'); if (ex) return ex.remove();
  setTimeout(() => addEventListener('pointerdown', function c(e) { if (!e.target.closest('.emo,.iconbtn')) { $('.emo')?.remove(); removeEventListener('pointerdown', c); } else if (!$('.emo')) removeEventListener('pointerdown', c); }), 0);
  const p = h('div', { class: 'emo' }, EMOJI.map((e) => h('button', { onclick: () => { const t = $('#ta'); t.value += e; autoGrow(); t.focus(); } }, e)));
  $('#composer').append(p);
}

/* ================= push ================= */
const b64 = (s) => { const p = '='.repeat((4 - (s.length % 4)) % 4); const r = atob((s + p).replace(/-/g, '+').replace(/_/g, '/')); return Uint8Array.from([...r].map((c) => c.charCodeAt(0))); };
function pushBlocker() {
  if (!window.isSecureContext) return 'Сайт открыт не по https — браузер не даёт включать уведомления. Нужен адрес https://…';
  try { if (window.top !== window) return 'Сайт открыт внутри другой страницы (встроенный просмотр). Откройте его в отдельной вкладке браузера.'; } catch (_) { return 'Сайт открыт внутри другой страницы (встроенный просмотр). Откройте его в отдельной вкладке браузера.'; }
  if (/FBAN|FBAV|Instagram|Telegram|; wv\)|Line\/|MiuiBrowser.*Mobile.*Version/i.test(navigator.userAgent)) return 'Вы открыли сайт во встроенном браузере приложения (Telegram, Instagram и т. п.) — там уведомления не работают. Откройте ссылку в Chrome или Safari.';
  return '';
}
function pushStatus() {
  const b = pushBlocker(); if (b) return b;
  if (!('serviceWorker' in navigator) || !('PushManager' in window)) return 'Не поддерживается. На iPhone добавьте oilim на экран «Домой».';
  return Notification.permission === 'granted' ? 'Разрешено на этом устройстве' : Notification.permission === 'denied' ? 'Заблокировано в настройках браузера' : 'Ещё не включено';
}
const swReady = () => Promise.race([
  navigator.serviceWorker.getRegistration().then((r) => r || navigator.serviceWorker.register('sw.js')).then(() => navigator.serviceWorker.ready),
  new Promise((_, rej) => setTimeout(() => rej(new Error('service worker не отвечает')), 8000)),
]);
const setPushState = () => { const el = $('#pushState'); if (el) el.textContent = pushStatus(); };
// ВАЖНО: requestPermission вызывается синхронно из клика (до любых await) — иначе Safari/iOS молча отклоняет.
async function enablePush() {
  if (!('serviceWorker' in navigator) || !('PushManager' in window)) { toast(pushStatus()); setPushState(); return false; }
  const blk = pushBlocker(); if (blk) { toast(blk); setPushState(); return false; }
  let perm = Notification.permission;
  if (perm === 'default') perm = await Notification.requestPermission();
  if (perm !== 'granted') { toast(perm === 'denied' ? 'Браузер блокирует уведомления для этого сайта. Разрешите их в настройках сайта (значок замка у адреса) и обновите страницу' : 'Вы закрыли запрос, не выбрав ответ. Нажмите ещё раз и выберите «Разрешить»'); await saveSettings({ push_enabled: false }); setPushState(); renderPanel(); return false; }
  await saveSettings({ push_enabled: true });
  const ok = await initPush(true); renderPanel(); return ok;
}
async function initPush(ask) {
  try {
    if (!('serviceWorker' in navigator) || !('PushManager' in window)) return false;
    if (Notification.permission !== 'granted' || !S.settings.push_enabled) { setPushState(); return false; }
    const reg = await swReady();
    let sub = await reg.pushManager.getSubscription();
    if (!sub) sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64(VAPID_PUBLIC) });
    const j = sub.toJSON();
    const { error } = await sb.from('oilim_push_subs').upsert({ user_id: uid(), endpoint: j.endpoint, p256dh: j.keys.p256dh, auth: j.keys.auth }, { onConflict: 'endpoint' });
    if (error) throw error;
    if (ask) toast('Push включены');
    setPushState(); return true;
  } catch (ex) { console.error('push', ex); if (ask) toast('Не удалось включить push: ' + (ex.message || ex)); setPushState(); return false; }
}
async function removePush() {
  try { const reg = await swReady(); const sub = await reg.pushManager.getSubscription();
    if (sub) { await sb.from('oilim_push_subs').delete().eq('endpoint', sub.endpoint); await sub.unsubscribe(); } } catch (_) {}
}

/* ================= старт ================= */
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
sb.auth.onAuthStateChange((ev) => { if (ev === 'SIGNED_OUT' && S.me) { S.me = null; showAuth(); } });
(async () => { const { data: { session } } = await sb.auth.getSession(); session ? startApp().catch(showAuth) : showAuth(); })();
</script>
